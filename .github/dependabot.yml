# Proposes updates to the pinned GitHub Actions and the Android dependencies once a month, against development.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    target-branch: development
    schedule:
      interval: monthly
    groups:
      android:
        patterns: ["*"]
