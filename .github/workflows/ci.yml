# Checks every push to main and development, and every pull request.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JavaScript and manifest parse
        run: |
          node --check app.js
          node --check sw.js
          node --check theme.js
          jq empty manifest.webmanifest
      - run: shellcheck -S error tools/build-words.sh
      - name: Site serves through nginx
        run: |
          docker compose up -d
          for i in $(seq 20); do curl -fsS -o /dev/null http://localhost:8090/ && break; sleep 1; done
          for p in / /app.js /theme.js /sw.js /style.css /manifest.webmanifest /words/scrabble.txt /words/british.txt; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "http://localhost:8090$p"
          done
      - if: always()
        run: docker compose down

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - name: Lint and build
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
