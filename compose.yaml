services:
  anagram-solver:
    image: nginx:alpine
    container_name: anagram-solver
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./icon.svg:/usr/share/nginx/html/icon.svg:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./words:/usr/share/nginx/html/words:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
